name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build universal CLI and Framework
        run: |
          xcodebuild -project libddpatmos.xcodeproj -scheme ddpatmos \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath .ci/Derived \
            OBJROOT="$PWD/.ci/Intermediates" SYMROOT="$PWD/.ci/Products" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify product architectures
        run: |
          lipo .ci/Products/Release/ddpatmos -verify_arch arm64 x86_64
          lipo .ci/Products/Release/libddpatmos.framework/Versions/A/libddpatmos -verify_arch arm64 x86_64
      - name: Verify CLI linkage and dynamic Framework
        run: |
          otool -L .ci/Products/Release/ddpatmos > .ci/cli-dependencies.txt
          if grep -Eq 'libddpatmos(Static)?\.framework' .ci/cli-dependencies.txt; then
            cat .ci/cli-dependencies.txt
            exit 1
          fi
          otool -hv .ci/Products/Release/libddpatmos.framework/Versions/A/libddpatmos | grep -q DYLIB
